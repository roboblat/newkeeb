# RIGHT half (peripheral)

# Read the local trackpad and forward it to the dongle.
CONFIG_ZMK_POINTING=y

# Cirque Pinnacle driver - must be enabled explicitly (this is what the working
# test build had and the real build was missing).
CONFIG_INPUT=y
CONFIG_INPUT_PINNACLE=y

# Pointer acceleration runs on this peripheral (accurate local timing).
CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y

# NO deep sleep - matches the old build's wake behavior (see left conf for why).
CONFIG_ZMK_SLEEP=n

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
