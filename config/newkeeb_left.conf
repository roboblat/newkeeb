# LEFT half (peripheral)

# Read the local trackpad and forward it to the dongle.
CONFIG_ZMK_POINTING=y

# Cirque Pinnacle driver - must be enabled explicitly (this is what the working
# test build had and the real build was missing).
CONFIG_INPUT=y
CONFIG_INPUT_PINNACLE=y

# Scroll acceleration runs on this peripheral (accurate local timing).
CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y

# NO deep sleep - matches the old zmk-config-gemini build's wake behavior.
# Deep sleep disconnects each half INDEPENDENTLY: only the key matrix (a
# wakeup-source) can wake a sleeping half - not the trackpad - and waking one
# half leaves the other asleep. Light idle instead keeps both halves BLE-
# connected and instantly responsive, and the trackpad wakes on touch. The
# Cirque sleep-mode-enable (shield dtsi) still low-powers the pads for battery.
CONFIG_ZMK_SLEEP=n

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
