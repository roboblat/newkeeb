# DONGLE (central, USB-powered)

# Pointing subsystem - receives both halves' forwarded pads and emits mouse HID.
CONFIG_ZMK_POINTING=y

# Zephyr input subsystem - the input-split proxies + listeners run on top of it.
# Enable explicitly (keys use the keymap path and work without it; the pointer
# path needs INPUT, which is why keys worked but the pads didn't).
CONFIG_INPUT=y

# ZMK Studio runtime keymap editing support
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Disable USB debug logging so ZMK Studio RPC CDC interface functions cleanly
CONFIG_ZMK_USB_LOGGING=n

# USB-powered, so no sleep needed here.
CONFIG_ZMK_SLEEP=n

# External Power disabled on bare USB dongle (no ext-power hardware MOSFET)
CONFIG_ZMK_EXT_POWER=n

# WS2812B RGB LED Configuration (D1 / P0.03)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# ---- YADS dongle screen (ST7789V 135x240) config from zmk-config-gemini ----
CONFIG_DONGLE_SCREEN_HORIZONTAL=y
CONFIG_DONGLE_SCREEN_FLIPPED=n
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
CONFIG_DONGLE_SCREEN_WPM_ACTIVE=y
CONFIG_DONGLE_SCREEN_MODIFIER_ACTIVE=y
CONFIG_DONGLE_SCREEN_LAYER_ACTIVE=y
CONFIG_DONGLE_SCREEN_OUTPUT_ACTIVE=y
CONFIG_DONGLE_SCREEN_BATTERY_ACTIVE=y
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=80
CONFIG_DONGLE_SCREEN_MIN_BRIGHTNESS=10
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=60
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=300
CONFIG_DONGLE_SCREEN_BRIGHTNESS_KEYBOARD_CONTROL=y
CONFIG_DONGLE_SCREEN_BONGO_ACTIVE=y
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=2
