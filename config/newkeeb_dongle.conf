# DONGLE (central, USB-powered)

# Pointing subsystem - receives both halves' forwarded pads and emits mouse HID.
CONFIG_ZMK_POINTING=y

# Pointer acceleration (central only). Paired with &pointer_accel in the overlay.
CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y

# USB-powered, so no sleep needed here.
CONFIG_ZMK_SLEEP=n

# Known ZMK issue #3156: with two peripherals, battery-level fetching could make
# one half drop. If you see a half not registering, try disabling it:
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
