# DIAGNOSTIC ONLY - standalone single-half USB keyboard + mouse.
# Not split (no ZMK_SPLIT), so USB HID is active and the trackpad drives the
# cursor directly. Flash to one half, plug into USB, touch the pad.

CONFIG_ZMK_POINTING=y

# USB console logging - open the COM port to see the Cirque I2C probe.
CONFIG_ZMK_USB_LOGGING=y

# DIAGNOSTIC: force the Cirque driver on and make its probe/init loud.
CONFIG_INPUT=y
CONFIG_INPUT_PINNACLE=y
CONFIG_INPUT_LOG_LEVEL_DBG=y
