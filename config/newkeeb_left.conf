# LEFT half (peripheral)

# Read the local trackpad and forward it to the dongle.
CONFIG_ZMK_POINTING=y

# Deep sleep - the two pads are the biggest drain; sleep aggressively (15 min).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# TEMP DEBUG: USB console logging. Plug this half into USB and open its COM port
# in a serial terminal to see whether the Cirque pad is detected on I2C.
# Remove once the trackpads are working.
CONFIG_ZMK_USB_LOGGING=y
