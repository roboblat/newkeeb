manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: oleksandrmaslov
      url-base: https://github.com/oleksandrmaslov
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-pointing-acceleration
      remote: oleksandrmaslov
      revision: main
  self:
    path: config

# NOTE: pointer acceleration is temporarily removed. The upstream module
# (oleksandrmaslov/zmk-pointing-acceleration) doesn't build against ZMK main /
# Zephyr 4.1 - its source includes <drivers/input_processor.h> without exporting
# ZMK's app/include path the way current ZMK requires. To re-add once a
# 4.1-compatible fork exists, restore:
#   remotes: - name: oleksandrmaslov  url-base: https://github.com/oleksandrmaslov
#   projects: - name: zmk-pointing-acceleration  remote: oleksandrmaslov  revision: main
# and re-enable the accel node + Kconfig in newkeeb_dongle.{overlay,conf}.
